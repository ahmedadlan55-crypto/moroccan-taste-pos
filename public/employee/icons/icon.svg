<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Full-canvas background gradient (fills maskable safe zone) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Decorative arcs (within safe zone 10%-90%) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="3"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(254,243,199,0.18)" stroke-width="2"/>

  <!-- Soft center glow -->
  <circle cx="256" cy="220" r="140" fill="rgba(255,255,255,0.08)"/>

  <!-- Employee head (circle) -->
  <circle cx="256" cy="200" r="52" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="256" cy="200" r="44" fill="url(#badge)"/>

  <!-- Employee body (rounded shoulders) -->
  <path d="M 168 380
           Q 168 290 256 290
           Q 344 290 344 380
           L 344 410
           L 168 410
           Z"
        fill="#ffffff"
        filter="url(#shadow)"/>
  <path d="M 178 380
           Q 178 300 256 300
           Q 334 300 334 380
           L 334 400
           L 178 400
           Z"
        fill="url(#badge)"/>

  <!-- Badge/ID indicator on chest -->
  <rect x="232" y="335" width="48" height="36" rx="6" fill="#0369a1" opacity="0.85"/>
  <line x1="244" y1="350" x2="268" y2="350" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="244" y1="358" x2="263" y2="358" stroke="#fef3c7" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Small "MT" mark at bottom -->
  <text x="256" y="465"
        font-family="Arial Black, Arial, sans-serif"
        font-size="32"
        font-weight="900"
        text-anchor="middle"
        fill="#ffffff"
        letter-spacing="6"
        opacity="0.95">MT</text>
</svg>
