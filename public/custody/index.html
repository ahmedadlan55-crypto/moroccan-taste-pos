<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>عهدتي — Moroccan Taste</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d47a1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MT Custody">

  <!-- v7.7 — Standalone custody portal: its OWN session token (cust_token) and
       its OWN login screen (like the employee portal). No longer piggybacks on
       the main app's pos_token. app.js decides login-vs-app on boot. -->
  <script>
    // Route the shared api-bridge to the custody session key.
    window.__API_TOKEN_KEY = 'cust_token';
    document.addEventListener('DOMContentLoaded', function() {
      document.body.classList.add('authenticated');
    });
    // Keep the user inside the portal while signed in.
    window.addEventListener('popstate', function() {
      if (localStorage.getItem('cust_token')) history.pushState({ custody: true }, '', '/custody/');
    });
  </script>
  <style>
    html, body { background: #0f172a; }
    body:not(.authenticated) { visibility: hidden !important; }
    /* v7.7 — standalone login screen */
    #custLoginPage { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:18px; background:linear-gradient(160deg,#0f172a,#1e1b4b); color:#fff; font-family:inherit; }
    #custLoginPage .cl-logo { width:72px; height:72px; border-radius:20px; background:linear-gradient(135deg,#7c3aed,#a855f7); display:flex; align-items:center; justify-content:center; font-size:32px; box-shadow:0 12px 30px rgba(124,58,237,.4); }
    #custLoginPage h1 { font-size:22px; font-weight:800; margin:4px 0 0; }
    #custLoginPage p { font-size:13px; color:#cbd5e1; margin:0 0 8px; }
    #custLoginPage .cl-card { width:100%; max-width:360px; display:flex; flex-direction:column; gap:12px; }
    #custLoginPage .cl-field { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:14px; padding:14px 16px; }
    #custLoginPage .cl-field i { color:#a78bfa; width:18px; text-align:center; }
    #custLoginPage .cl-field input { flex:1; background:transparent; border:none; outline:none; color:#fff; font-size:15px; font-family:inherit; }
    #custLoginPage .cl-field input::placeholder { color:#94a3b8; }
    #custLoginPage .cl-btn { margin-top:6px; background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff; border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:800; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px; }
    #custLoginPage .cl-btn:disabled { opacity:.6; }
    #custLoginPage .cl-err { color:#fca5a5; font-size:13px; min-height:18px; text-align:center; font-weight:700; }
  </style>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/shared/design-tokens.css?v=2">
  <link rel="stylesheet" href="/custody/style.css?v=2">

  <script defer src="/shared/api-bridge.js"></script>
  <script defer src="/custody/app.js?v=6"></script>
</head>
<body>

  <!-- Loader -->
  <div id="loader">
    <div class="loader-ring"></div>
    <p>جاري التحميل...</p>
  </div>

  <!-- v7.7 — Standalone login screen (shown by app.js when no custody session) -->
  <div id="custLoginPage" style="display:none;">
    <div class="cl-logo"><i class="fas fa-hand-holding-usd"></i></div>
    <h1>بوابة العهدة</h1>
    <p>سجّل دخولك لإدارة عهدتك ومصروفاتك</p>
    <div class="cl-card">
      <div class="cl-field"><i class="fas fa-user"></i><input type="text" id="clUser" placeholder="اسم المستخدم" autocomplete="username" dir="ltr" style="text-align:right;"></div>
      <div class="cl-field"><i class="fas fa-lock"></i><input type="password" id="clPass" placeholder="كلمة المرور" autocomplete="current-password"></div>
      <div class="cl-err" id="clErr"></div>
      <button class="cl-btn" id="clBtn" onclick="custDoLogin()"><i class="fas fa-sign-in-alt"></i> دخول</button>
    </div>
  </div>

  <!-- Main App Shell -->
  <div id="app" style="display:none;">

    <!-- Top Bar -->
    <header id="topBar">
      <div class="tb-right">
        <div class="tb-avatar"><i class="fas fa-hand-holding-usd"></i></div>
        <div>
          <div class="tb-title" id="headerName">عهدتي</div>
          <div class="tb-sub" id="headerNum"></div>
        </div>
      </div>
      <div class="tb-actions">
        <button class="tb-btn refresh-btn" onclick="refreshData()" title="تحديث">
          <i class="fas fa-sync-alt"></i>
        </button>
        <button class="tb-btn logout-btn" onclick="doLogout()" title="خروج">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </header>

    <!-- Scrollable Content -->
    <main id="mainContent">

      <!-- Branch Name -->
      <div class="branch-bar" id="branchBar" style="display:none;">
        <i class="fas fa-store"></i>
        <span id="branchName"></span>
      </div>

      <!-- Stats Strip -->
      <div class="stats-strip">
        <div class="stat-card stat-balance">
          <i class="fas fa-wallet"></i>
          <div class="stat-body">
            <span class="stat-label">الرصيد</span>
            <span class="stat-val" id="sBalance">0.00</span>
          </div>
        </div>
        <div class="stat-card stat-in">
          <i class="fas fa-arrow-circle-up"></i>
          <div class="stat-body">
            <span class="stat-label">التغذية</span>
            <span class="stat-val" id="sTopups">0.00</span>
          </div>
        </div>
        <div class="stat-card stat-out">
          <i class="fas fa-arrow-circle-down"></i>
          <div class="stat-body">
            <span class="stat-label">المصروفات</span>
            <span class="stat-val" id="sExpenses">0.00</span>
          </div>
        </div>
      </div>

      <!-- v6.27.1 — Tab Navigation -->
      <div class="cust-tabs">
        <button class="cust-tab active" id="tabExpenses" onclick="custSwitchTab('expenses')">
          <i class="fas fa-list-alt"></i>
          <span>سجل المصروفات</span>
          <span class="cust-tab-badge" id="expBadge">0</span>
        </button>
        <button class="cust-tab" id="tabHistory" onclick="custSwitchTab('history')">
          <i class="fas fa-history"></i>
          <span>سجل العهد</span>
          <span class="cust-tab-badge" id="historyBadge">0</span>
        </button>
      </div>

      <!-- Panel: Expenses (default visible) -->
      <div id="panelExpenses">
        <div id="expList" class="exp-list"></div>
      </div>

      <!-- Panel: History (hidden until tab clicked) -->
      <div id="panelHistory" style="display:none;">
        <div id="historyList" class="history-list"></div>
      </div>

    </main>

    <!-- Action Buttons -->
    <div class="action-bar">
      <button class="fab" onclick="openModal()">
        <i class="fas fa-plus"></i>
        <span>إضافة مصروف</span>
      </button>
      <button class="close-btn" id="closeBtn" onclick="requestClose()" style="display:none;">
        <i class="fas fa-lock"></i>
        <span>إقفال العهدة</span>
      </button>
    </div>

  </div>

  <!-- Add Expense Bottom Sheet -->
  <div id="sheet" class="bottom-sheet" style="display:none;">
    <div class="sheet-overlay" onclick="closeModal()"></div>
    <div class="sheet-content">
      <div class="sheet-handle"></div>
      <div class="sheet-title">
        <i class="fas fa-receipt"></i> مصروف جديد
      </div>

      <div class="field-row">
        <div class="field">
          <label>التاريخ</label>
          <input type="date" id="fDate" class="fi">
        </div>
        <div class="field">
          <label>القيمة</label>
          <input type="number" id="fAmt" class="fi" inputmode="decimal" step="0.01" placeholder="0.00">
        </div>
      </div>
      <div class="field full" style="position:relative;">
        <label style="display:flex;justify-content:space-between;align-items:center;">
          <span>نوع المصروف</span>
          <button type="button" onclick="openAddExpenseType()" style="border:none;background:rgba(59,130,246,0.1);color:#3b82f6;padding:3px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;"><i class="fas fa-plus"></i> جديد</button>
        </label>
        <input type="text" id="fExpTypeSearch" class="fi" placeholder="ابحث عن نوع المصروف..." oninput="filterExpTypes(this.value)" onfocus="filterExpTypes('')" autocomplete="off">
        <div id="fExpTypeDropdown" style="position:absolute;top:100%;left:0;right:0;z-index:100;background:#fff;border:1.5px solid #e2e8f0;border-radius:0 0 12px 12px;max-height:200px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.12);"></div>
        <input type="hidden" id="fExpType" value="">
        <input type="hidden" id="fExpTypeName" value="">
      </div>
      <div class="field full">
        <label>مركز التكلفة</label>
        <select id="fCostCenter" class="fi">
          <option value="">— اختياري —</option>
        </select>
      </div>
      <div class="field full">
        <label>البيان</label>
        <input type="text" id="fDesc" class="fi" placeholder="وصف المصروف...">
      </div>
      <div class="field-row">
        <div class="field">
          <label>ضريبة؟</label>
          <select id="fVat" class="fi" onchange="togVat()">
            <option value="0">لا</option>
            <option value="1">نعم</option>
          </select>
        </div>
        <div class="field" id="vatBox" style="display:none;">
          <label>النسبة %</label>
          <input type="number" id="fVatR" class="fi" value="15" step="0.1">
        </div>
      </div>
      <div class="field full">
        <label>ملاحظات</label>
        <input type="text" id="fNotes" class="fi" placeholder="اختياري...">
      </div>
      <div class="field full">
        <label>صورة الفاتورة</label>
        <label class="upload-area" for="fImg" id="uploadLabel">
          <i class="fas fa-camera"></i>
          <span>اضغط لرفع صورة أو PDF</span>
        </label>
        <input type="file" id="fImg" accept="image/*,application/pdf" capture="environment" onchange="pickImg(this)" style="display:none;">
        <div id="imgPrev"></div>
      </div>

      <button class="save-btn" id="saveBtn" onclick="doSave()">
        <i class="fas fa-paper-plane"></i> إرسال المصروف
      </button>
    </div>
  </div>

  <!-- Override Confirm Sheet -->
  <div id="overrideSheet" class="bottom-sheet" style="display:none;">
    <div class="sheet-overlay" onclick="closeOverride()"></div>
    <div class="sheet-content">
      <div class="sheet-handle"></div>
      <div class="sheet-title" style="color:var(--amber);">
        <i class="fas fa-exclamation-triangle"></i> تجاوز الرصيد
      </div>
      <div id="overrideMsg" style="padding:12px 0;font-size:14px;line-height:1.7;color:#475569;"></div>
      <div style="display:flex;gap:10px;">
        <button class="save-btn" style="background:linear-gradient(135deg,var(--amber),#d97706);" onclick="confirmOverride()">
          <i class="fas fa-paper-plane"></i> إرسال طلب تجاوز
        </button>
        <button style="flex:0 0 auto;padding:14px 20px;border:none;border-radius:14px;background:rgba(100,116,139,0.1);color:var(--slate);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;" onclick="closeOverride()">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- Close Custody Sheet -->
  <div id="closeSheet" class="bottom-sheet" style="display:none;">
    <div class="sheet-overlay" onclick="closeCloseSheet()"></div>
    <div class="sheet-content">
      <div class="sheet-handle"></div>
      <div class="sheet-title" style="color:var(--red);">
        <i class="fas fa-lock"></i> طلب إقفال العهدة
      </div>
      <div id="closeInfo" style="padding:12px 0;font-size:14px;line-height:1.7;color:#475569;"></div>
      <div class="field full">
        <label>ملاحظات (اختياري)</label>
        <input type="text" id="closeNotes" class="fi" placeholder="سبب الإقفال...">
      </div>
      <button class="save-btn" style="background:linear-gradient(135deg,var(--red),#b91c1c);margin-top:10px;" id="closeSaveBtn" onclick="confirmClose()">
        <i class="fas fa-lock"></i> تأكيد طلب الإقفال
      </button>
    </div>
  </div>

  <!-- v6.27.0 — Custody Detail Sheet (report + print) -->
  <div id="detailSheet" class="bottom-sheet" style="display:none;">
    <div class="sheet-overlay" onclick="closeDetailSheet()"></div>
    <div class="sheet-content">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="detailSheetTitle">
        <i class="fas fa-file-alt"></i> تفاصيل العهدة
      </div>
      <div id="detailBody" style="overflow-y:auto;max-height:55vh;"></div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="save-btn" onclick="showPrintFilter()" style="flex:1;">
          <i class="fas fa-print"></i> طباعة التقرير
        </button>
        <button style="flex:0 0 auto;padding:14px 20px;border:none;border-radius:14px;
          background:rgba(100,116,139,0.1);color:var(--slate);font-size:14px;
          font-weight:700;cursor:pointer;font-family:inherit;" onclick="closeDetailSheet()">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- v6.27.0 — Print Filter Sheet -->
  <div id="printFilterSheet" class="bottom-sheet" style="display:none;">
    <div class="sheet-overlay" onclick="closePrintFilter()"></div>
    <div class="sheet-content">
      <div class="sheet-handle"></div>
      <div class="sheet-title"><i class="fas fa-print"></i> خيارات الطباعة</div>
      <div style="display:flex;flex-direction:column;gap:12px;padding:12px 0;">
        <label class="pf-option">
          <input type="radio" name="pfMode" value="all" checked>
          <span><strong>كل المصروفات</strong><br><small>طباعة جميع المصروفات بغض النظر عن حالتها</small></span>
        </label>
        <label class="pf-option">
          <input type="radio" name="pfMode" value="accepted">
          <span><strong>المقبولة فقط</strong><br><small>طباعة المصروفات المعتمدة والمرحّلة فقط</small></span>
        </label>
      </div>
      <button class="save-btn" onclick="doPrintWithFilter()">
        <i class="fas fa-print"></i> طباعة
      </button>
    </div>
  </div>

  <!-- Image/PDF Viewer -->
  <div id="viewer" class="img-viewer" style="display:none;">
    <div class="img-viewer-content" onclick="event.stopPropagation();">
      <img id="viewerImg" src="" alt="معاينة الصورة">
    </div>
    <button class="viewer-close" onclick="closeViewer()" title="إغلاق" aria-label="إغلاق"><i class="fas fa-times" aria-hidden="true"></i></button>
  </div>

  <!-- Toast -->
  <div id="toasts"></div>

</body>
</html>
