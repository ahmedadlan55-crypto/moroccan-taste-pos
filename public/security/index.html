<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>الأمان — تغيير كلمة المرور</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    :root { --bg:#0f172a; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --accent:#0ea5e9; --ok:#10b981; --bad:#e11d48; --line:#e2e8f0; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Segoe UI',Tahoma,system-ui,sans-serif; background:linear-gradient(160deg,#0f172a,#1e293b); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
    .card { background:var(--card); color:var(--ink); width:100%; max-width:440px; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.35); padding:28px 24px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; margin-bottom:4px; }
    .brand i { color:var(--accent); }
    .crumbs { color:var(--muted); font-size:12px; font-weight:700; margin-bottom:18px; }
    label { display:block; font-size:12px; font-weight:800; color:var(--muted); margin:14px 0 6px; }
    .field-wrap { position:relative; }
    input[type=password], input[type=text] { width:100%; height:46px; border:1.5px solid var(--line); border-radius:12px; padding:0 14px; font-size:15px; direction:ltr; text-align:left; font-variant-numeric:tabular-nums; }
    input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(14,165,233,.15); }
    .toggle { position:absolute; inset-inline-end:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer; padding:6px; }
    .meter { height:8px; border-radius:999px; background:#eef2f7; overflow:hidden; margin-top:10px; }
    .meter > i { display:block; height:100%; width:0; transition:width .2s,background .2s; }
    .reqs { list-style:none; padding:0; margin:12px 0 0; display:grid; gap:5px; }
    .reqs li { font-size:12px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:8px; }
    .reqs li.ok { color:var(--ok); }
    .reqs li i { width:14px; }
    button.primary { width:100%; height:48px; margin-top:20px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-weight:800; font-size:15px; cursor:pointer; }
    button.primary:disabled { opacity:.5; cursor:not-allowed; }
    .msg { margin-top:14px; padding:11px 13px; border-radius:12px; font-size:13px; font-weight:700; display:none; }
    .msg.err { background:#fef2f2; color:var(--bad); display:block; }
    .msg.ok { background:#ecfdf5; color:var(--ok); display:block; }
    .banner { background:#fff7ed; color:#9a3412; border:1px solid #fed7aa; border-radius:12px; padding:10px 12px; font-size:12.5px; font-weight:800; margin-bottom:14px; display:none; }
    .back { display:inline-flex; align-items:center; gap:6px; margin-top:16px; color:var(--muted); font-size:12.5px; font-weight:800; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><i class="fas fa-shield-halved"></i><span>الأمان</span></div>
    <div class="crumbs">الإعدادات ← الأمان ← تغيير كلمة المرور</div>
    <div class="banner" id="mustBanner"><i class="fas fa-triangle-exclamation"></i> حسابك يستخدم كلمة مرور افتراضية — يُرجى تغييرها الآن.</div>

    <form id="pwForm" autocomplete="on" novalidate>
      <label for="cur">كلمة المرور الحالية</label>
      <div class="field-wrap">
        <input id="cur" type="password" autocomplete="current-password" required />
        <button class="toggle" type="button" data-for="cur" aria-label="إظهار/إخفاء"><i class="fas fa-eye"></i></button>
      </div>
      <label for="nw">كلمة المرور الجديدة</label>
      <div class="field-wrap">
        <input id="nw" type="password" autocomplete="new-password" required />
        <button class="toggle" type="button" data-for="nw" aria-label="إظهار/إخفاء"><i class="fas fa-eye"></i></button>
      </div>
      <div class="meter" aria-hidden="true"><i id="meterBar"></i></div>
      <ul class="reqs" id="reqs">
        <li data-k="len"><i class="fas fa-circle"></i> 12 حرفًا على الأقل (يُوصى بـ 16+)</li>
        <li data-k="letter"><i class="fas fa-circle"></i> حرف واحد على الأقل</li>
        <li data-k="digit"><i class="fas fa-circle"></i> رقم واحد على الأقل</li>
        <li data-k="special"><i class="fas fa-circle"></i> رمز خاص (!@#$…)</li>
        <li data-k="notcommon"><i class="fas fa-circle"></i> ليست شائعة/افتراضية</li>
      </ul>
      <label for="cf">تأكيد كلمة المرور الجديدة</label>
      <div class="field-wrap">
        <input id="cf" type="password" autocomplete="new-password" required />
        <button class="toggle" type="button" data-for="cf" aria-label="إظهار/إخفاء"><i class="fas fa-eye"></i></button>
      </div>
      <button class="primary" id="submitBtn" type="submit" disabled>تغيير كلمة المرور</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
    <a class="back" href="/" id="backLink"><i class="fas fa-arrow-right"></i> العودة</a>
  </div>
  <script src="/security/app.js"></script>
</body>
</html>
