<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Moroccan Taste POS System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">

  <!-- ─── INSTANT SESSION CHECK ───
       Runs SYNCHRONOUSLY before any paint. If a saved session exists,
       hides login and shows loader. User NEVER sees the login screen on reload. -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('pos_token');
        var s = localStorage.getItem('pos_session');
        if (t && s) {
          var role = '';
          try { role = (JSON.parse(s).role || '').toLowerCase(); } catch(e) {}
          if (role === 'cashier') { window.location.replace('/pos/'); return; }
          if (role === 'custody') { window.location.replace('/custody/'); return; }
          // employee role: stays on admin (employee portal is independent at /employee/)
          // Admin/manager — add has-session class to <html> so CSS hides login immediately
          document.documentElement.className += ' has-session';
        }
      } catch(e) {}
    })();
  </script>

  <!-- ─── CRITICAL AUTH GATE ───
       Fallback: if no saved session, show login form and hide everything else. -->
  <style id="critical-auth-gate">
    html, body { margin: 0; padding: 0; background: radial-gradient(circle at top right, #1e293b, #0f172a); }
    body:not(.authenticated) > *:not(#loginView):not(#loader):not(#toastContainer):not(#critical-auth-gate) {
      display: none !important;
      visibility: hidden !important;
    }
    /* Show login ONLY when no saved session */
    html:not(.has-session) body:not(.authenticated) #loginView { display: flex !important; visibility: visible !important; }
    /* Saved session exists: hide login, show loader until JS finishes */
    html.has-session body:not(.authenticated) #loginView { display: none !important; visibility: hidden !important; }
    html.has-session body:not(.authenticated) #loader { display: flex !important; }
    body:not(.authenticated) .modal,
    body:not(.authenticated) .glass-modal,
    body:not(.authenticated) .modal-overlay { display: none !important; }
  </style>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=34">
  <link rel="stylesheet" href="/css/warehouse-ops.css?v=20">
  <link rel="stylesheet" href="/css/inventory-catalog.css?v=3">
  <link rel="stylesheet" href="/css/txn-letter.css?v=1">

  <!-- ═══════════════════════════════════════════════════════════════════
       V5.7.36 — INLINE FULLSCREEN OVERRIDE for the recipe editor.
       Targets the ACTUAL wo-modal-* classes the editor's WoModal renders
       (the previous v5.7.35 rule used wom-* selectors that never matched —
       that's why the modal stayed at its default 600px width). The
       data-re-fullscreen attribute is stamped on by erp.js belt-and-
       suspenders code so the rule applies even without :has() support.
       Embedded directly in index.html so it takes effect even when
       /css/warehouse-ops.css is served from cache.
       ═══════════════════════════════════════════════════════════════════ -->
  <style id="re-fullscreen-override">
    /* Modern browsers: scope to recipe editor via :has() */
    .wo-modal-overlay:has(#reEditorBody) {
      padding: 0 !important;
    }
    .wo-modal-overlay:has(#reEditorBody) .wo-modal {
      max-width: 100vw !important;
      width:     100vw !important;
      max-height:100vh !important;
      height:    100vh !important;
      border-radius: 0 !important;
      margin: 0 !important;
    }
    .wo-modal-overlay:has(#reEditorBody) .wo-modal-body   { padding: 14px 18px !important; gap: 0 !important; background: #f6f7fb; }
    .wo-modal-overlay:has(#reEditorBody) .wo-modal-header { padding: 12px 18px !important; }
    .wo-modal-overlay:has(#reEditorBody) .wo-modal-footer { padding: 10px 18px !important; }
    /* Fallback for browsers without :has(): erp.js stamps data-re-fullscreen */
    .wo-modal-overlay[data-re-fullscreen] { padding: 0 !important; }
    .wo-modal[data-re-fullscreen] {
      max-width: 100vw !important;
      width:     100vw !important;
      max-height:100vh !important;
      height:    100vh !important;
      border-radius: 0 !important;
      margin: 0 !important;
    }
    .wo-modal-body[data-re-fullscreen] { padding: 14px 18px !important; gap: 0 !important; background: #f6f7fb; }
  </style>

  <!-- Heavy libs (Chart.js, XLSX, QRCode, erp.js) are NOT loaded eagerly anymore.
       app.js loads them on-demand via loadScript() before any function that
       needs them runs. This drops the initial payload by ~380 KB on mobile. -->
</head>
<body class="ar">

  <!-- Full Screen Loader (hidden by default, shown only during API calls) -->
  <div id="loader" style="display:none;">
    <div class="spinner"></div>
    <h3 style="margin-top:20px; color:var(--secondary); font-weight:800;" data-i18n="loading">جاري التحميل...</h3>
  </div>

  <!-- 1. LOGIN SCREEN — V3.1 polished, fully responsive -->
  <div id="loginView">
    <!-- Top-right corner: language toggle (visible on all sizes) -->
    <button class="login-lang-toggle" id="loginLangToggle" type="button" onclick="toggleLoginLang()" aria-label="Toggle language">
      <i class="fas fa-globe"></i>
      <span id="loginLangLabel">EN</span>
    </button>

    <div class="login-box">
      <div class="login-logo" id="loginLogoBox">
        <span class="login-logo-fallback">&#9749;</span>
      </div>
      <div class="login-title" id="loginCompanyName">Moroccan Taste</div>
      <p class="login-subtitle" data-i18n="login">تسجيل الدخول</p>

      <div class="login-field">
        <input type="text" id="lUser" class="form-control" placeholder="اسم المستخدم" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" onkeypress="if(event.key==='Enter') doLogin()">
        <i class="fas fa-user login-field-icon"></i>
      </div>
      <div class="login-field">
        <input type="password" id="lPass" class="form-control" placeholder="كلمة المرور" autocomplete="current-password" onkeypress="if(event.key==='Enter') doLogin()">
        <i class="fas fa-lock login-field-icon"></i>
        <button type="button" class="login-pass-toggle" id="loginPassToggle" onclick="toggleLoginPass()" aria-label="Show/hide password" tabindex="-1">
          <i class="fas fa-eye" id="loginPassIcon"></i>
        </button>
      </div>

      <div class="login-row">
        <label class="login-remember">
          <input type="checkbox" id="lRemember">
          <span class="login-remember-mark"></span>
          <span data-i18n="rememberMe">تذكرني</span>
        </label>
      </div>

      <button class="btn btn-primary login-submit" onclick="doLogin()" type="button">
        <span data-i18n="login">تسجيل الدخول</span>
        <i class="fas fa-arrow-left login-submit-arrow"></i>
      </button>
    </div>

    <!-- Bottom credit (very subtle) -->
    <div class="login-version">v3.1 · Moroccan Taste POS</div>
  </div>
  <script>
  (function() {
    // Restore language preference + give the toggle button immediate effect
    var saved = localStorage.getItem('pos_lang') || 'ar';
    var lbl = document.getElementById('loginLangLabel');
    if (lbl) lbl.textContent = saved === 'ar' ? 'EN' : 'AR';
    document.documentElement.dir = saved === 'ar' ? 'rtl' : 'ltr';
    document.documentElement.lang = saved;
    document.body.className = (document.body.className || '').replace(/\b(ar|en)\b/g, '').trim() + ' ' + saved;
    window.toggleLoginLang = function() {
      var cur = document.documentElement.lang === 'ar' ? 'ar' : 'en';
      var nxt = cur === 'ar' ? 'en' : 'ar';
      localStorage.setItem('pos_lang', nxt);
      document.documentElement.dir = nxt === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.lang = nxt;
      document.body.className = (document.body.className || '').replace(/\b(ar|en)\b/g, '').trim() + ' ' + nxt;
      var lbl2 = document.getElementById('loginLangLabel');
      if (lbl2) lbl2.textContent = nxt === 'ar' ? 'EN' : 'AR';
      // Update placeholders + buttons live (so user sees change immediately)
      var u = document.getElementById('lUser'); if (u) u.placeholder = nxt === 'ar' ? 'اسم المستخدم' : 'Username';
      var p = document.getElementById('lPass'); if (p) p.placeholder = nxt === 'ar' ? 'كلمة المرور' : 'Password';
      var sub = document.querySelector('.login-subtitle'); if (sub) sub.textContent = nxt === 'ar' ? 'تسجيل الدخول' : 'Login';
      var rem = document.querySelector('.login-remember span:last-of-type'); if (rem) rem.textContent = nxt === 'ar' ? 'تذكرني' : 'Remember me';
      var btn = document.querySelector('.login-submit span'); if (btn) btn.textContent = nxt === 'ar' ? 'تسجيل الدخول' : 'Login';
    };
    window.toggleLoginPass = function() {
      var f = document.getElementById('lPass');
      var i = document.getElementById('loginPassIcon');
      if (!f || !i) return;
      if (f.type === 'password') { f.type = 'text'; i.className = 'fas fa-eye-slash'; }
      else { f.type = 'password'; i.className = 'fas fa-eye'; }
    };
  })();
  </script>

  <!-- TEMPLATE_INJECTION_POINT -->
  <!-- ========================================== -->
  <!-- 4. MAIN APP SCRIPT                         -->
  <!-- ========================================== -->
  <script src="/shared/txn-constants.js?v=1"></script>
  <script src="/shared/txn-letter.js?v=2"></script>
  <script src="/shared/txn-view.js?v=1"></script>
  <!-- V5.7.12 — on-the-fly Google Translate for DB-sourced content -->
  <script src="/shared/dynamic-i18n.js?v=2"></script>
  <script src="/js/api-bridge.js?v=53"></script>
  <script src="/js/wo-modal.js?v=1"></script>
  <!-- V5.7.26 — reusable major+minor quantity input widget -->
  <script src="/js/wo-qty-input.js?v=1"></script>
  <script src="/js/erp-v5.js?v=1"></script>
  <script src="/js/erp-v54.js?v=1"></script>
  <script src="/js/app.js?v=56" defer></script>
</body>
</html>
